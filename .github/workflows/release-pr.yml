name: release-pr

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for branch containment checks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Ensure tag commit is on development
        run: |
          git fetch origin development main --prune
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF")"
          echo "Tag SHA: $TAG_SHA"
          # Verify TAG_SHA is reachable from origin/development
          git merge-base --is-ancestor "$TAG_SHA" "origin/development"

      - name: Create release branch from tag and push
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF")"
          BRANCH="release/${TAG_NAME}"

          # Create branch at the tagged commit
          git checkout -B "$BRANCH" "$TAG_SHA"

          # Push (overwrite if it already exists to keep it in sync with the tag)
          git push origin "$BRANCH" --force

      - name: Open PR to main (or reuse existing)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const head = `release/${tag}`;
            const base = 'main';

            // Check if a PR already exists from this head -> base
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base
            });

            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number} ${prs[0].html_url}`);
              return;
            }

            const title = `Release ${tag}`;
            const body = [
              `Automated release PR for tag **${tag}**.`,
              ``,
              `- Source branch: \`${head}\``,
              `- Target branch: \`${base}\``,
              ``,
              `Once merged, this tag is effectively promoted to \`${base}\`.`
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head,
              base,
              body
            });

            core.info(`Opened PR: #${pr.data.number} ${pr.data.html_url}`);
