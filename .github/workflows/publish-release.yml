name: publish-release

on:
  pull_request:
    types: [closed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  publish:
    # Only run when the PR was merged AND it came from release/v*
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag name
        id: tag
        run: |
          # head.ref is like: release/v0.1.0
          REF="${{ github.event.pull_request.head.ref }}"
          TAG="${REF#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout (so we can verify tag exists)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: Verify tag exists
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git tag --list | grep -qx "$TAG"

      - name: Create GitHub Release (or skip if exists)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.tag.outputs.tag }}";

            // If release already exists, do nothing.
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.info(`Release already exists for ${tag}: ${existing.data.html_url}`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // Auto-generate notes
            const notes = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag
            });

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: notes.data.body,
              draft: false,
              prerelease: false
            });

            core.info(`Created release: ${release.data.html_url}`);
